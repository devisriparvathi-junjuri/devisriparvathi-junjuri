<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 120" width="100%" height="100%">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0b1021" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="footerLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <style>
      .mono { font-family: 'Fira Code', 'Courier New', monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif; }
    </style>
  </defs>

  <rect x="2" y="2" width="946" height="116" rx="14" fill="url(#footerBg)" stroke="#1e293b" stroke-width="1.2" />
  
  <!-- Glowing Top Circuit Line -->
  <path d="M 16 2 L 934 2" stroke="url(#footerLine)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Center Decorative Node -->
  <circle cx="475" cy="2" r="4.5" fill="#00f2fe" />
  <circle cx="475" cy="2" r="2" fill="#ffffff" />

