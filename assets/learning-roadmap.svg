<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="100%" height="100%">
  <defs>
    <linearGradient id="roadBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="roadLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="30%" stop-color="#00f2fe" />
      <stop offset="65%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <style>
      .mono { font-family: 'Fira Code', 'Courier New', monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif; }
      .step-num { font-size: 11px; font-weight: 700; fill: #94a3b8; }
      .step-title { font-size: 13.5px; font-weight: 700; fill: #f8fafc; }
      .step-desc { font-size: 11px; fill: #94a3b8; }
      .status-tag { font-size: 9.5px; font-weight: 700; letter-spacing: 0.8px; }
    </style>
  </defs>

  <!-- Container -->
  <rect x="2" y="2" width="916" height="216" rx="14" fill="url(#roadBg)" stroke="#1e293b" stroke-width="1.2" />

  <!-- Connecting Pathway Line -->
  <line x1="80" y1="80" x2="840" y2="80" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />
  <line x1="80" y1="80" x2="650" y2="80" stroke="url(#roadLine)" stroke-width="4" stroke-linecap="round" />

  <!-- Milestone 1 -->
  <g transform="translate(60, 48)">
    <!-- Node Circle -->
    <circle cx="20" cy="32" r="14" fill="#064e3b" stroke="#10b981" stroke-width="2.5" />
    <text x="16" y="36" class="mono" font-size="12" font-weight="800" fill="#34d399">✓</text>
    <!-- Tag -->
    <rect x="-18" y="-18" width="80" height="18" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="0.8" />
    <text x="-8" y="-5" fill="#34d399" class="mono status-tag">COMPLETE</text>
    <!-- Info -->
    <text x="-14" y="68" class="sans step-title">CS &amp; Python</text>
    <text x="-14" y="86" class="mono step-desc">Core Fundamentals</text>
    <text x="-14" y="102" class="mono step-desc">Data Structures, C</text>
  </g>

  <!-- Milestone 2 -->
  <g transform="translate(250, 48)">
    <!-- Node Circle -->
    <circle cx="20" cy="32" r="14" fill="#0c4a6e" stroke="#00f2fe" stroke-width="2.5" />
    <text x="16" y="36" class="mono" font-size="12" font-weight="800" fill="#38bdf8">✓</text>
    <!-- Tag -->
    <rect x="-18" y="-18" width="80" height="18" rx="4" fill="#0c4a6e" stroke="#00f2fe" stroke-width="0.8" />
    <text x="-8" y="-5" fill="#38bdf8" class="mono status-tag">DEPLOYED</text>
    <!-- Info -->
    <text x="-14" y="68" class="sans step-title">Data &amp; ML</text>
    <text x="-14" y="86" class="mono step-desc">Postgres, Pandas, ML</text>
    <text x="-14" y="102" class="mono step-desc">Tableau &amp; Power BI</text>
  </g>

  <!-- Milestone 3 -->
  <g transform="translate(440, 48)">
    <!-- Node Circle -->
    <circle cx="20" cy="32" r="14" fill="#3b0764" stroke="#a855f7" stroke-width="2.5" />
    <circle cx="20" cy="32" r="6" fill="#c084fc" />
    <!-- Tag -->
    <rect x="-24" y="-18" width="94" height="18" rx="4" fill="#3b0764" stroke="#a855f7" stroke-width="0.8" />
    <text x="-14" y="-5" fill="#c084fc" class="mono status-tag">IN PROGRESS</text>
    <!-- Info -->
    <text x="-14" y="68" class="sans step-title">Java &amp; DSA</text>
    <text x="-14" y="86" class="mono step-desc">OOP Architecture</text>
    <text x="-14" y="102" class="mono step-desc">Algorithmic Problem-Solving</text>
  </g>

  <!-- Milestone 4 -->
  <g transform="translate(630, 48)">
    <!-- Node Circle -->
    <circle cx="20" cy="32" r="14" fill="#172554" stroke="#3b82f6" stroke-width="2.5" />
    <circle cx="20" cy="32" r="6" fill="#60a5fa" />
    <!-- Tag -->
    <rect x="-24" y="-18" width="94" height="18" rx="4" fill="#172554" stroke="#3b82f6" stroke-width="0.8" />
    <text x="-14" y="-5" fill="#60a5fa" class="mono status-tag">ACTIVE FOCUS</text>
    <!-- Info -->
    <text x="-14" y="68" class="sans step-title">Backend &amp; APIs</text>
    <text x="-14" y="86" class="mono step-desc">RESTful Services</text>
    <text x="-14" y="102" class="mono step-desc">Database Engineering</text>
  </g>

  <!-- Milestone 5 -->
  <g transform="translate(800, 48)">
    <!-- Node Circle -->
    <circle cx="20" cy="32" r="14" fill="#1e293b" stroke="#64748b" stroke-width="2" />
    <circle cx="20" cy="32" r="4" fill="#94a3b8" />
    <!-- Tag -->
    <rect x="-18" y="-18" width="76" height="18" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="0.8" />
    <text x="-8" y="-5" fill="#94a3b8" class="mono status-tag">UPCOMING</text>
    <!-- Info -->
    <text x="-14" y="68" class="sans step-title">Cloud &amp; DevOps</text>
    <text x="-14" y="86" class="mono step-desc">CI/CD Pipelines</text>
    <text x="-14" y="102" class="mono step-desc">Cloud Deployment</text>
  </g>

</svg>