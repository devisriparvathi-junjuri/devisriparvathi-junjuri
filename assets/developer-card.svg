<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>

    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <style>
      .mono { font-family: 'Fira Code', 'Courier New', monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif; }
      .key { font-size: 11px; fill: #64748b; font-weight: 600; letter-spacing: 0.8px; }
      .val { font-size: 12px; fill: #f1f5f9; font-weight: 600; }
      .accent { fill: #00f2fe; }
      .purple { fill: #c084fc; }
    </style>
  </defs>

  <!-- Card Background -->
  <rect x="2" y="2" width="436" height="276" rx="14" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="1.2" />

  <!-- Subtle Inner Grid -->
  <line x1="20" y1="46" x2="420" y2="46" stroke="#1e293b" stroke-width="1" />
  
  <!-- Header Bar -->
  <circle cx="24" cy="24" r="4.5" fill="#ef4444" />
  <circle cx="38" cy="24" r="4.5" fill="#f59e0b" />
  <circle cx="52" cy="24" r="4.5" fill="#10b981" />
  <text x="72" y="28" class="mono" font-size="11.5" fill="#94a3b8">dev_profile.json</text>
  <text x="350" y="28" class="mono" font-size="10.5" fill="#00f2fe">ACTIVE ◉</text>

  <!-- Key Value Data Pairs -->
  <!-- Row 1 -->
  <g transform="translate(24, 70)">
    <text x="0" y="0" class="mono key">"developer":</text>
    <text x="120" y="0" class="mono val accent">"Devi Sri Parvathi Junjuri"</text>
  </g>

  <!-- Row 2 -->
  <g transform="translate(24, 96)">
    <text x="0" y="0" class="mono key">"education":</text>
    <text x="120" y="0" class="mono val">"B.Sc. Computer Science"</text>
  </g>

  <!-- Row 3 -->
  <g transform="translate(24, 122)">
    <text x="0" y="0" class="mono key">"focus_areas":</text>
    <text x="120" y="0" class="mono val purple">["SWE", "Analytics", "AI"]</text>
  </g>

  <!-- Row 4 -->
  <g transform="translate(24, 148)">
    <text x="0" y="0" class="mono key">"core_languages":</text>
    <text x="120" y="0" class="mono val">["Python", "SQL", "C"]</text>
  </g>

  <!-- Row 5 -->
  <g transform="translate(24, 174)">
    <text x="0" y="0" class="mono key">"databases":</text>
    <text x="120" y="0" class="mono val">["PostgreSQL", "MySQL"]</text>
  </g>

  <!-- Row 6 -->
  <g transform="translate(24, 200)">
    <text x="0" y="0" class="mono key">"learning":</text>
    <text x="120" y="0" class="mono val" fill="#38bdf8">["Java", "DSA", "DevOps"]</text>
  </g>

  <!-- Mini Progress / Stats Box at Bottom -->
  <rect x="20" y="222" width="400" height="42" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
  <text x="36" y="244" class="mono" font-size="10.5" fill="#94a3b8">ENGINEERING RIGOR</text>
  <rect x="180" y="235" width="220" height="10" rx="5" fill="#1e293b" />
  <rect x="180" y="235" width="200" height="10" rx="5" fill="url(#barGrad)" />
  <text x="36" y="257" class="mono" font-size="9" fill="#64748b">Practical Projects • Clean Code • Analytical Depth</text>
</svg>