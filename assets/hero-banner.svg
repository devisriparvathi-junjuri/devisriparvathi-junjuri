<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 320" width="100%" height="100%">
  <defs>
    <!-- Dark Space Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c17" />
      <stop offset="50%" stop-color="#0a1020" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Header Gradient -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0e172a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.9" />
    </linearGradient>

    <!-- Electric Title Gradient -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#00f2fe" />
      <stop offset="85%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Electric Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Violet Glow Gradient -->
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glow Radial Lights -->
    <radialGradient id="topGlow" cx="80%" cy="10%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bottomGlow" cx="15%" cy="90%" r="45%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.25" />
      <circle cx="30" cy="0" r="1" fill="#00f2fe" fill-opacity="0.3" />
    </pattern>

    <!-- Outer Border Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .mono { font-family: 'Fira Code', 'Courier New', 'Consolas', monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif; }
      
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.9; }
        50% { opacity: 0.4; }
      }
      @keyframes floatBeam {
        0% { transform: translateX(0); }
        50% { transform: translateX(12px); }
        100% { transform: translateX(0); }
      }
      .pulsing-dot { animation: pulseGlow 2.5s infinite ease-in-out; }
      .telemetry-tag { font-size: 10.5px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; }
      .main-title { font-weight: 800; font-size: 35px; letter-spacing: 0.5px; }
      .sub-title { font-size: 14.5px; font-weight: 500; fill: #cbd5e1; }
      .hud-title { font-size: 10px; font-weight: 700; letter-spacing: 1.2px; fill: #94a3b8; }
      .hud-val { font-size: 13px; font-weight: 600; fill: #f8fafc; }
    </style>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="946" height="316" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Cyber Grid -->
  <rect x="2" y="2" width="946" height="316" rx="16" fill="url(#cyberGrid)" />

  <!-- Ambient Light Orbs -->
  <rect x="2" y="2" width="946" height="316" rx="16" fill="url(#topGlow)" />
  <rect x="2" y="2" width="946" height="316" rx="16" fill="url(#bottomGlow)" />

  <!-- Glowing Border Accent Lines -->
  <path d="M 18 2 L 240 2" stroke="url(#cyanGrad)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 700 318 L 932 318" stroke="url(#violetGrad)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Terminal Top Bar -->
  <path d="M 2 18 C 2 9.16 9.16 2 18 2 L 932 2 C 940.84 2 948 9.16 948 18 L 948 44 L 2 44 Z" fill="url(#headerGrad)" />
  <line x1="2" y1="44" x2="948" y2="44" stroke="#334155" stroke-width="1" stroke-opacity="0.4" />

  <!-- Window Dots -->
  <circle cx="28" cy="23" r="5.5" fill="#ef4444" />
  <circle cx="46" cy="23" r="5.5" fill="#f59e0b" />
  <circle cx="64" cy="23" r="5.5" fill="#10b981" />

  <!-- Terminal File Name -->
  <text x="88" y="27" fill="#94a3b8" class="mono" font-size="12" font-weight="500">⚡ devisriparvathi-junjuri.py</text>
  <text x="310" y="27" fill="#475569" class="mono" font-size="12">|</text>
  <text x="325" y="27" fill="#64748b" class="mono" font-size="11">ENGINEERING_PORTFOLIO_V2.6</text>

  <!-- Live Status Badge (Top Right) -->
  <g transform="translate(730, 13)">
    <rect x="0" y="0" width="195" height="22" rx="11" fill="#064e3b" fill-opacity="0.5" stroke="#10b981" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="14" cy="11" r="4" fill="#34d399" class="pulsing-dot" />
    <text x="26" y="15" fill="#34d399" class="sans" font-size="10.5" font-weight="600" letter-spacing="0.6">OPEN TO OPPORTUNITIES</text>
  </g>

  <!-- Circuit Trace Line 1 -->
  <path d="M 35 110 L 80 110 L 110 80 L 170 80" fill="none" stroke="#00f2fe" stroke-width="1.2" stroke-opacity="0.4" />
  <circle cx="170" cy="80" r="3" fill="#00f2fe" fill-opacity="0.7" />

  <!-- Circuit Trace Line 2 (Right) -->
  <path d="M 915 200 L 870 200 L 840 230 L 780 230" fill="none" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.4" />
  <circle cx="780" cy="230" r="3" fill="#a855f7" fill-opacity="0.7" />

  <!-- Telemetry Tags -->
  <g transform="translate(42, 74)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="170" height="24" rx="6" fill="#0369a1" fill-opacity="0.18" stroke="#0284c7" stroke-width="1" stroke-opacity="0.5" />
    <text x="12" y="16" fill="#38bdf8" class="mono telemetry-tag">⚡ SOFTWARE ENGINEER</text>

    <!-- Tag 2 -->
    <rect x="180" y="0" width="168" height="24" rx="6" fill="#581c87" fill-opacity="0.22" stroke="#9333ea" stroke-width="1" stroke-opacity="0.5" />
    <text x="192" y="16" fill="#c084fc" class="mono telemetry-tag">◈ DATA &amp; AI DEVELOPER</text>

    <!-- Tag 3 -->
    <rect x="358" y="0" width="186" height="24" rx="6" fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-width="1" stroke-opacity="0.5" />
    <text x="370" y="16" fill="#94a3b8" class="mono telemetry-tag">✦ B.SC. COMPUTER SCIENCE</text>
  </g>

  <!-- Main Name Title -->
  <text x="42" y="142" fill="url(#cyanPurple)" class="sans main-title">DEVI SRI PARVATHI JUNJURI</text>

  <!-- Subtitle with accents -->
  <text x="42" y="174" class="sans sub-title">
    <tspan fill="#e2e8f0">Building Scalable Software</tspan>
    <tspan fill="#8b5cf6" font-weight="700"> ◆ </tspan>
    <tspan fill="#38bdf8" font-weight="600">Python &amp; SQL Analytics</tspan>
    <tspan fill="#8b5cf6" font-weight="700"> ◆ </tspan>
    <tspan fill="#e2e8f0">Applied Machine Learning &amp; AI</tspan>
  </text>

  <!-- Decorative Separator Line -->
  <line x1="42" y1="195" x2="908" y2="195" stroke="#334155" stroke-width="1" stroke-opacity="0.4" />

  <!-- HUD Cards Row -->
  <!-- HUD Card 1 -->
  <g transform="translate(42, 212)">
    <rect x="0" y="0" width="275" height="74" rx="10" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1" />
    <line x1="0" y1="0" x2="0" y2="74" stroke="#00f2fe" stroke-width="3.5" stroke-linecap="round" />
    <text x="18" y="24" class="mono hud-title">CORE DISCIPLINE</text>
    <text x="18" y="46" class="sans hud-val">Software Engineering &amp; ML</text>
    <text x="18" y="62" class="mono" font-size="10.5" fill="#64748b">Algorithms • Architectures • OOP</text>
  </g>

  <!-- HUD Card 2 -->
  <g transform="translate(337, 212)">
    <rect x="0" y="0" width="275" height="74" rx="10" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1" />
    <line x1="0" y1="0" x2="0" y2="74" stroke="#a855f7" stroke-width="3.5" stroke-linecap="round" />
    <text x="18" y="24" class="mono hud-title">PRIMARY ARSENAL</text>
    <text x="18" y="46" class="sans hud-val">Python • SQL • Postgres • ML</text>
    <text x="18" y="62" class="mono" font-size="10.5" fill="#64748b">NumPy • Pandas • Scikit-learn</text>
  </g>

  <!-- HUD Card 3 -->
  <g transform="translate(633, 212)">
    <rect x="0" y="0" width="275" height="74" rx="10" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1" />
    <line x1="0" y1="0" x2="0" y2="74" stroke="#3b82f6" stroke-width="3.5" stroke-linecap="round" />
    <text x="18" y="24" class="mono hud-title">LEARNING HORIZON</text>
    <text x="18" y="46" class="sans hud-val">Java • DSA • Backend • Cloud</text>
    <text x="18" y="62" class="mono" font-size="10.5" fill="#64748b">APIs • DevOps • Distributed Sys</text>
  </g>

</svg>